[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mwa-bot"
version = "0.1.0"
description = "Telegram-бот MWA METHOD: бесплатное 3-дневное знакомство с методом"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.31,<4",
    "aiohttp>=3.9",
    "pydantic-settings>=2.15,<3",
    "sqlalchemy[asyncio]>=2.1,<2.2",
    "aiosqlite>=0.22",
]

[project.optional-dependencies]
dev = ["ruff", "pytest", "pytest-asyncio"]

[tool.hatch.build.targets.wheel]
packages = ["mwa_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Тексты проекта на русском: правила о "похожих" символах ловят обычную кириллицу.
ignore = ["RUF001", "RUF002", "RUF003"]
